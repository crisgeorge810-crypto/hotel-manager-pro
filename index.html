<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#091f3d">
<meta name="description" content="Hotel Manager Pro - hotel operations management">
<link rel="manifest" href="./manifest.webmanifest">
<title>Hotel Manager Pro</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="brand-mark">H</div><div><strong>HOTEL MANAGER</strong><small>PRO</small></div></div>
    <div class="hotel-label" id="hotelLabel">YOUR HOTEL</div>
    <nav id="navigation"></nav>
    <div class="side-foot"><span class="status-dot"></span> Local workspace</div>
  </aside>
  <main class="main">
    <header class="topbar">
      <button class="menu-btn" id="menuBtn" aria-label="Open menu">☰</button>
      <div><div class="eyebrow" id="crumb">MANAGEMENT CENTRE</div><h1 id="pageTitle">Dashboard</h1></div>
      <div class="top-actions"><span class="local-pill">● Offline-ready workspace</span><button class="secondary" id="backupQuick">Backup</button></div>
    </header>
    <section id="view" class="view"></section>
    <footer>Hotel Manager Pro · Local data stays on this device until you export or connect a backend.</footer>
  </main>
</div>
<div class="modal-backdrop" id="modalBackdrop" hidden>
 <section class="modal"><div class="modal-head"><h2 id="modalTitle">Add record</h2><button class="icon-btn" id="modalClose">×</button></div><form id="recordForm"><div id="formFields" class="form-grid"></div><div class="modal-actions"><button type="button" class="secondary" id="cancelModal">Cancel</button><button class="primary" type="submit">Save record</button></div></form></section>
</div>
<input type="file" id="importFile" accept=".json,.csv,.txt" hidden>
<script src="./app.js"></script>
</body>
</html>
