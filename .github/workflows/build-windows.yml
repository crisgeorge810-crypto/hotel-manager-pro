
name: Build Hotel Manager Pro for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer and portable app
        run: npx electron-builder --win nsis portable --publish never

      - name: Upload Windows applications
        uses: actions/upload-artifact@v4
        with:
          name: Hotel-Manager-Pro-Windows
          path: |
            dist/*.exe
          if-no-files-found: error
          retention-days: 14
